user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Rate limiting: 10 requests per second burst 20 per client IP
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

  # Upstream to Flask app
  upstream flask_app {
    server app:5000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Nginx stub_status for exporter on HTTP too
    location = /nginx_status {
      stub_status;
      access_log off;
      allow 127.0.0.1;
      allow 172.16.0.0/12; # docker default subnet ranges
      allow 10.0.0.0/8;
      allow 192.168.0.0/16;
      deny all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/$host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$host/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # HSTS (optional; enable after confirming HTTPS works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ACME challenge passthrough on 443 too
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Rate limiting per IP
    limit_req zone=perip burst=20 nodelay;

    # Nginx stub_status for exporter
    location = /nginx_status {
      stub_status;
      access_log off;
      allow 127.0.0.1;
      allow 172.16.0.0/12; # docker default subnet ranges
      allow 10.0.0.0/8;
      allow 192.168.0.0/16;
      deny all;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://flask_app;
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
    }

    # Healthcheck
    location = /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}


