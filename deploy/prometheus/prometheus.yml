global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'app'
    static_configs:
      - targets: ['app:5000']
    metrics_path: /metrics
    scheme: http

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']


